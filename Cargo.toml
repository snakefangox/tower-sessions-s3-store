[package]
name = "tower-sessions-s3-store"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
moka = { version = "0.12.16", features = ["future"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls", "fail-on-err", "tags"] }
serde-zap = "0.1.1"
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core"] }
